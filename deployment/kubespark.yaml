kind: Deployment
apiVersion: apps/v1
metadata:
  name: kubespark
  namespace: kubespark
  annotations:
    deployment.kubernetes.io/revision: "14"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubespark
  template:
    metadata:
      labels:
        app: kubespark
        app.kubernetes.io/name: kubespark
    spec:
      restartPolicy: Always
      containers:
        - name: kubespark
          image: tanqidi/kubespark:dev
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: DRONE_YAML_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubespark-secret
                  key: DRONE_YAML_SECRET
            - name: KUBESPARK_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubespark-secret
                  key: KUBESPARK_JWT_SECRET
            - name: KUBESPARK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubespark-secret
                  key: KUBESPARK_PASSWORD
            - name: KUBESPARK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kubespark-secret
                  key: KUBESPARK_USERNAME
          ports:
            - name: tcp-8080
              protocol: TCP
              containerPort: 8080
          resources: {}
          volumeMounts:
            - name: host-time
              mountPath: /etc/localtime
              readOnly: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: ""
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: kubespark-admin
      serviceAccountName: kubespark-admin
      terminationGracePeriodSeconds: 30
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: kubespark
  namespace: kubespark
  labels:
    app: kubespark
spec:
  type: ClusterIP
  selector:
    app: kubespark
  ports:
    - name: tcp-8080
      protocol: TCP
      port: 8080
      targetPort: tcp-8080
