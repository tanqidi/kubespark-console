apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspacenamespacebindings.tanqidi.com
  annotations:
    description: 企业空间与命名空间绑定关系资源
spec:
  group: tanqidi.com
  scope: Cluster
  names:
    plural: workspacenamespacebindings
    singular: workspacenamespacebinding
    kind: WorkspaceNamespaceBinding
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                workspaceRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                namespaceRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
              required:
                - workspaceRef
                - namespaceRef
