apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelineprojects.tanqidi.com
  annotations:
    description: 流水线项目资源
spec:
  group: tanqidi.com
  scope: Cluster
  names:
    plural: pipelineprojects
    singular: pipelineproject
    kind: PipelineProject
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                workspaceRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                displayName:
                  type: string
                description:
                  type: string
              required:
                - workspaceRef
