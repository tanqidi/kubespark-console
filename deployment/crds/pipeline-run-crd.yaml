apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelineruns.tanqidi.com
  annotations:
    description: 流水线运行实例资源
spec:
  group: tanqidi.com
  scope: Cluster
  names:
    plural: pipelineruns
    singular: pipelinerun
    kind: PipelineRun
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                pipelineRef:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                  required:
                    - name
                trigger:
                  type: object
                  properties:
                    type:
                      type: string
                data:
                  type: object
                  description: 运行时覆盖数据，key 自定义，value 可存任意文本
                  additionalProperties:
                    type: string
              required:
                - pipelineRef
            status:
              type: object
              properties:
                phase:
                  type: string
                droneBuildNumber:
                  type: integer
                  format: int64
                  minimum: 1
                droneBuildLink:
                  type: string
                  maxLength: 2048
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 128
                      status:
                        type: string
                      reason:
                        type: string
                        maxLength: 128
                      message:
                        type: string
                        maxLength: 2048
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
                      - lastTransitionTime
