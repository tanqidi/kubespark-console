apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelineruns.tanqidi.com
  annotations:
    description: 流水线运行实例资源
spec:
  group: tanqidi.com
  scope: Cluster
  names:
    plural: pipelineruns
    singular: pipelinerun
    kind: PipelineRun
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                pipelineRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                data:
                  type: object
                  properties:
                    branch:
                      type: string
                    namespace:
                      type: string
                    repo:
                      type: string
                  required:
                    - branch
                    - namespace
                    - repo
                trigger:
                  type: object
                  properties:
                    type:
                      type: string
              required:
                - pipelineRef
                - data
