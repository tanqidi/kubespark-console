apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelines.tanqidi.com
  annotations:
    description: 流水线资源
spec:
  group: tanqidi.com
  scope: Cluster
  names:
    plural: pipelines
    singular: pipeline
    kind: Pipeline
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                workspaceRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                pipelineProjectRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                data:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - pipelineProjectRef
