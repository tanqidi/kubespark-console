apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelines.tanqidi.com
  annotations:
    description: 流水线项目资源
spec:
  group: tanqidi.com
  scope: Cluster
  names:
    plural: pipelines
    singular: pipeline
    kind: Pipeline
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                workspaceRef:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                  required:
                    - name
                source:
                  type: object
                  properties:
                    url:
                      type: string
                      minLength: 1
                      maxLength: 2048
                    branch:
                      type: string
                      minLength: 1
                      maxLength: 255
                    authSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                      required:
                        - name
                  required:
                    - url
              required:
                - workspaceRef
                - source
