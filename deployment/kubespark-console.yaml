apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubespark-console
  namespace: kubespark
  labels:
    app: kubespark-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubespark-console
  template:
    metadata:
      labels:
        app: kubespark-console
    spec:
      containers:
        - name: kubespark-console
          image: tanqidi/kubespark-console:dev
          imagePullPolicy: Always
          ports:
            - name: tcp-3000
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: KUBESPARK_API_BASE
              value: "http://kubespark:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: kubespark-console
  namespace: kubespark
  labels:
    app: kubespark-console
spec:
  type: NodePort
  selector:
    app: kubespark-console
  ports:
    - name: tcp-3000
      protocol: TCP
      port: 3000
      targetPort: tcp-3000
      nodePort: 30000
