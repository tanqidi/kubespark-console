apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubespark-drone-server
  namespace: kubespark
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubespark-drone-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubespark-drone-server
        app: kubespark-drone-server
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      serviceAccountName: default
      containers:
        - name: drone
          image: drone/drone:2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: DRONE_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: drone-secret
                  key: DRONE_GITHUB_CLIENT_ID
            - name: DRONE_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: drone-secret
                  key: DRONE_GITHUB_CLIENT_SECRET
            - name: DRONE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: drone-secret
                  key: DRONE_RPC_SECRET
            - name: DRONE_SERVER_HOST
              valueFrom:
                secretKeyRef:
                  name: drone-secret
                  key: DRONE_SERVER_HOST
            - name: DRONE_SERVER_PROTO
              valueFrom:
                secretKeyRef:
                  name: drone-secret
                  key: DRONE_SERVER_PROTO
          ports:
            - name: tcp-80
              protocol: TCP
              containerPort: 80
          volumeMounts:
            - name: host-time
              readOnly: true
              mountPath: /etc/localtime
            - name: drone-data
              mountPath: /data
      volumes:
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: ""
        - name: drone-data
          persistentVolumeClaim:
            claimName: drone-data
  revisionHistoryLimit: 10
  replicas: 1
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: kubespark-drone-server
  namespace: kubespark
spec:
  type: NodePort
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: kubespark-drone-server
  ports:
    - protocol: TCP
      name: tcp-80
      port: 80
      targetPort: 80
      nodePort: 30001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drone-data
  namespace: kubespark
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeMode: Filesystem
